[package]
name = "workshop-relay-realtime-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
signalwire = { package = "signalwire-sdk", version = "1.1" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
