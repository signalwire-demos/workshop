plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.signalwire:signalwire-sdk:2.0.2'
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'WorkshopApp'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
}
