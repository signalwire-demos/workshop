[package]
name = "workshop-ai-agent-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
signalwire = "1.1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
